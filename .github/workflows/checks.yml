name: Focused Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-r29.txt
      - name: Installer and controller checks (not a physical success benchmark)
        run: python -m pytest -q tests/test_prepare_r29_inputs.py tests/test_coordinated_pick_place_r29.py tests/test_native_motion_evaluation.py tests/test_vision_anchored_load_reference.py
